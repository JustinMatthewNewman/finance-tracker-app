# dataconnect/finance/mutations.gql
#
# TWO GUARD PATTERNS ARE USED HERE, AND THEY ARE NOT INTERCHANGEABLE.
#
#   1. `user_update(first: { where: { googleUid: { eq_expr: "auth.uid" } } })`
#      — for the per-account preference writes. There is no id variable at
#      all, so there is nothing for a caller to tamper with: the row is
#      selected by the verified token.
#
#   2. `@transaction` + `query @redact { ... @check(expr: ...) }` — for
#      anything that takes a row id from the client. The check runs inside
#      the same transaction as the write and aborts it unless the row's owner
#      is the caller. Without it, `familyMember_update(id: $x)` happily edits
#      another household's row: knowing a UUID is not authorization.
#
#      @redact keeps the guard query's result out of the response, so the
#      mutation can't be used as an oracle to confirm a row exists.
#
# Any new mutation that accepts an id MUST carry pattern 2. A USER-level
# mutation with a bare id and no @check is a cross-tenant write.

# $userTypeName defaults to "Regular" so the no-arg call site in
# app/api/auth/sync-user/route.ts stays source-compatible — same defaulting
# trick as the $limit/$offset params over in queries.gql. Passing it explicitly
# rather than leaning on the column default keeps the tier a new account gets
# visible here instead of buried in the schema.
mutation CreateUserFromGoogle(
  $userId: UUID!
  $selfFamilyMemberId: UUID!
  $googleUid: String!
  $username: String!
  $email: String!
  $createdAt: Timestamp!
  $userTypeName: String! = "Regular"
) @auth(level: NO_ACCESS) @transaction {
  userType_upsert(data: { name: $userTypeName })
  user_insert(data: {
    # Supplied rather than generated, because two rows below have to point at
    # it inside this same transaction and Data Connect cannot reference the
    # result of an earlier field in the same document. The caller generates it
    # with crypto.randomUUID — see app/api/auth/sync-user/route.ts.
    id: $userId
    googleUid: $googleUid
    username: $username
    email: $email
    userTypeName: $userTypeName
    createdAt: $createdAt
    # THE ACCOUNT'S SETTINGS ROW IS CREATED HERE, NESTED, AND THAT IS THE
    # WHOLE POINT — a User cannot come into existence without one.
    #
    # It used to be created nowhere at all, and the failure was silent in a
    # way worth remembering. Every preference write is a
    # `userSetting_update(first: { where: ... })` (see below), and an update
    # that matches zero rows is not an error — it reports success having
    # done nothing. The contexts then set their local state optimistically
    # and never re-read, so a toggle looked like it saved right up until the
    # page was reloaded. No account had ever persisted a single preference.
    #
    # Nesting it inside user_insert, rather than issuing a second insert
    # after it, is what makes that unrepresentable going forward: there is
    # no ordering, no second round trip and no partial state to recover
    # from. The empty object is deliberate — every column on UserSetting is
    # nullable or carries a @default in schema.gql, so the defaults live in
    # exactly one place instead of being restated here and drifting.
    userSetting_on_user: {}
  })
  # THE ACCOUNT'S OWN ENTRY IN ITS HOUSEHOLD, created here for exactly the
  # same reason the settings row is: so that it cannot fail to exist.
  #
  # A User is an account and a FamilyMember is a person whose money is
  # tracked. Nothing connected the two, so a new account arrived at an empty
  # sidebar and had to add itself before it could record a single
  # transaction — the one person guaranteed to be in the household was the
  # one person missing from it.
  #
  # `selfUserId` is what marks this row as representing the account rather
  # than somebody the account merely tracks, and its @unique constraint is
  # what stops a retried sign-in or a racing backfill producing two of them.
  # `userId` is the same account because it also OWNS the row — the two
  # columns mean different things and happen to coincide here alone.
  #
  # Not nested inside user_insert above: a nested row cannot set a second
  # foreign key back to the parent it is being created under.
  familyMember_insert(data: {
    id: $selfFamilyMemberId
    userId: $userId
    selfUserId: $userId
    name: $username
    relationship: "Self"
  })
}

# NO_ACCESS — deliberately not callable from the browser. A USER-level version
# of this would let any signed-in account promote itself to Admin, since the
# only thing it takes is a target user id. Invoke it from trusted server code
# via the Admin SDK (@financeconnect/admin-generated), the same way sync-user
# calls CreateUserFromGoogle.
mutation SetUserType($userId: UUID!, $userTypeName: String!) @auth(level: NO_ACCESS) {
  user_update(id: $userId, data: { userTypeName: $userTypeName })
}

# ─────────────────────────────────────────────────────────────────────────────
# Per-account preferences (pattern 1 — no id, scoped by auth.uid)
# ─────────────────────────────────────────────────────────────────────────────

mutation SelectMyColorScheme($colorSchemeId: UUID!) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { colorSchemeId: $colorSchemeId }
  )
}

# Resets the signed-in user back to no DB color scheme (falls back to
# HeroUI's built-in default palette). A separate mutation because a literal
# `null` can't share a document with a variant that sets a required variable.
mutation ClearMyColorScheme @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { colorSchemeId: null }
  )
}

# Persists the signed-in user's performance-mode preference so it follows
# them across devices instead of living only in localStorage.
mutation SelectMyPerformanceMode($performanceMode: Boolean!) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { performanceMode: $performanceMode }
  )
}

# Percentage multiplier for AmbientBackground's intensity (see schema.gql).
mutation SelectMyBackgroundOpacity($backgroundOpacity: Int!) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { backgroundOpacity: $backgroundOpacity }
  )
}

# $externalAccountLinkTemplate is nullable (unlike SelectMyPerformanceMode's
# required Boolean), so a single mutation covers both setting and clearing
# the template — no separate Clear variant needed like ClearMyColorScheme.
mutation SelectMyExternalAccountLinkTemplate($externalAccountLinkTemplate: String) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { externalAccountLinkTemplate: $externalAccountLinkTemplate }
  )
}

# Opacity and blur move together in the UI (one "glass" control), so they
# share one mutation rather than costing two round trips per drag.
mutation SelectMyCardStyle($cardOpacity: Int!, $cardBlur: Int!) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { cardOpacity: $cardOpacity, cardBlur: $cardBlur }
  )
}

mutation SelectMySquareCorners($squareCorners: Boolean!) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { squareCorners: $squareCorners }
  )
}

mutation SelectMyBordersEnabled($bordersEnabled: Boolean!) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { bordersEnabled: $bordersEnabled }
  )
}

mutation SelectMyCategoryColorsEnabled($categoryColorsEnabled: Boolean!) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { categoryColorsEnabled: $categoryColorsEnabled }
  )
}

mutation SelectMyCurrency($currencyCode: String!) @auth(level: USER) {
  userSetting_update(
    first: { where: { user: { googleUid: { eq_expr: "auth.uid" } } } }
    data: { currencyCode: $currencyCode }
  )
}

# ─────────────────────────────────────────────────────────────────────────────
# Family members (pattern 2 — client-supplied id, ownership checked)
# ─────────────────────────────────────────────────────────────────────────────

# $familyMemberId is generated client-side (crypto.randomUUID) rather than
# returned by the server, so the caller can select the new row in the sidebar
# immediately without a second round trip. Note the hyphen caveat in
# hooks/useFamilyMembers.ts: Data Connect returns UUIDs with hyphens stripped.
mutation CreateFamilyMember(
  $userId: UUID!
  $familyMemberId: UUID!
  $name: String!
  $relationship: String
  $color: String
  $monthlyIncomeTargetMinor: Int
) @auth(level: USER) @transaction {
  # $userId names the owner of the row about to be inserted, and it arrives
  # from the browser. Unguarded, this wrote a household member into somebody
  # else's household — the file header's rule applied to an insert rather than
  # an update, which is easy to miss precisely because there is no existing
  # row whose ownership looks like it needs checking.
  query @redact {
    user(key: { id: $userId }) @check(
      expr: "this != null && this.googleUid == auth.uid"
      message: "Not authorized to add a household member for this account"
    ) {
      googleUid
    }
  }
  familyMember_insert(data: {
    id: $familyMemberId
    userId: $userId
    name: $name
    relationship: $relationship
    color: $color
    monthlyIncomeTargetMinor: $monthlyIncomeTargetMinor
  })
}

mutation UpdateFamilyMember(
  $familyMemberId: UUID!
  $name: String!
  $relationship: String
  $color: String
  $externalAccountRef: String
  $monthlyIncomeTargetMinor: Int
) @auth(level: USER) @transaction {
  query @redact {
    familyMember(key: { id: $familyMemberId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to modify this family member") {
        googleUid
      }
    }
  }
  familyMember_update(id: $familyMemberId, data: {
    name: $name
    relationship: $relationship
    color: $color
    externalAccountRef: $externalAccountRef
    monthlyIncomeTargetMinor: $monthlyIncomeTargetMinor
  })
}

# Rename-only variant, so the sidebar's inline rename doesn't have to resend
# (and risk clobbering) every other field with whatever it last read.
mutation RenameFamilyMember($familyMemberId: UUID!, $name: String!) @auth(level: USER) @transaction {
  query @redact {
    familyMember(key: { id: $familyMemberId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to rename this family member") {
        googleUid
      }
    }
  }
  familyMember_update(id: $familyMemberId, data: { name: $name })
}

# Soft delete — see the isDeleted note in schema.gql. A hard delete would
# cascade to every transaction this person ever had.
mutation DeleteFamilyMember($familyMemberId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    familyMember(key: { id: $familyMemberId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to delete this family member") {
        googleUid
      }
      # An account cannot remove its own entry from its household.
      #
      # That row is created with the User and is what puts the signed-in
      # person in their own sidebar; deleting it would leave them looking at a
      # household they are not in, with no way back short of a database edit —
      # nothing re-creates it, because CreateUserFromGoogle only ever runs
      # once per account.
      #
      # Enforced here rather than only by hiding the button, because the UI is
      # not the boundary: this mutation takes an id and is callable directly.
      selfUser @check(expr: "this == null", message: "You can't remove yourself from your own household") {
        id
      }
    }
  }
  familyMember_update(id: $familyMemberId, data: { isDeleted: true })
}


# ─────────────────────────────────────────────────────────────────────────────
# Categories (shared lookup rows)
# ─────────────────────────────────────────────────────────────────────────────

# Find-or-create by name — the table is keyed on `name`, which is what makes
# this idempotent. Called whenever a transaction is saved against a category
# that may not exist yet, so typing a new category name in the form just
# works.
#
# No ownership check, and that is correct rather than an oversight: Category
# is a shared lookup table with no owner, exactly like the template's Ticket.
# It holds no personal data — a name, a kind and a color.
mutation UpsertCategory(
  $name: String!
  $kind: String! = "EXPENSE"
  $parentGroup: String
  $color: String
) @auth(level: USER) {
  category_upsert(data: {
    name: $name
    kind: $kind
    parentGroup: $parentGroup
    color: $color
  })
}

mutation UpdateCategory(
  $name: String!
  $kind: String!
  $parentGroup: String
  $color: String
) @auth(level: USER) {
  category_update(key: { name: $name }, data: {
    kind: $kind
    parentGroup: $parentGroup
    color: $color
  })
}

# ─────────────────────────────────────────────────────────────────────────────
# Transactions (pattern 2 on every id-taking operation)
# ─────────────────────────────────────────────────────────────────────────────

# $categoryName rather than a category id: the table is keyed on name, and
# the form lets people type a category that may not exist yet. Call
# UpsertCategory first (see hooks/useTransactions.ts), then pass the name
# here — a two-step the client owns, since Data Connect can't express
# "insert-or-get then reference" in one document.
mutation CreateTransaction(
  $userId: UUID!
  $familyMemberId: UUID!
  $amountMinor: Int!
  $direction: String!
  $occurredOn: Date!
  $createdAt: Timestamp!
  $description: String
  $merchant: String
  $method: String
  $recurrence: String
  $categoryName: String
  $source: String = "MANUAL"
  $status: String = "POSTED"
) @auth(level: USER) @transaction {
  query @redact {
    familyMember(key: { id: $familyMemberId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to add transactions for this family member") {
        googleUid
      }
    }
    # The family member was always checked; $userId was not, and it is a
    # separate variable naming the row's owner. Stamping a transaction with
    # somebody else's userId used to be possible, and it matters more now than
    # it did: ownership is what the household visibility filter joins through,
    # so a mislabelled row is one that surfaces in the wrong household.
    user(key: { id: $userId }) @check(
      expr: "this != null && this.googleUid == auth.uid"
      message: "Not authorized to record transactions for this account"
    ) {
      googleUid
    }
  }
  transaction_insert(data: {
    userId: $userId
    familyMemberId: $familyMemberId
    amountMinor: $amountMinor
    direction: $direction
    occurredOn: $occurredOn
    createdAt: $createdAt
    description: $description
    merchant: $merchant
    method: $method
    recurrence: $recurrence
    categoryName: $categoryName
    source: $source
    status: $status
  })
}

mutation UpdateTransaction(
  $transactionId: UUID!
  $amountMinor: Int!
  $direction: String!
  $occurredOn: Date!
  $description: String
  $merchant: String
  $method: String
  $recurrence: String
  $categoryName: String
  $source: String = "MANUAL"
  $status: String = "POSTED"
) @auth(level: USER) @transaction {
  query @redact {
    transaction(key: { id: $transactionId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to modify this transaction") {
        googleUid
      }
    }
  }
  transaction_update(id: $transactionId, data: {
    amountMinor: $amountMinor
    direction: $direction
    occurredOn: $occurredOn
    description: $description
    merchant: $merchant
    method: $method
    recurrence: $recurrence
    categoryName: $categoryName
    source: $source
    status: $status
  })
}

# Clearing the category needs its own mutation: a literal `null` can't share
# a document with the variant above that sets it from a variable. Same reason
# ClearMyColorScheme is separate.
mutation UpdateTransactionClearCategory(
  $transactionId: UUID!
  $amountMinor: Int!
  $direction: String!
  $occurredOn: Date!
  $description: String
  $merchant: String
  $method: String
  $recurrence: String
  $source: String = "MANUAL"
  $status: String = "POSTED"
) @auth(level: USER) @transaction {
  query @redact {
    transaction(key: { id: $transactionId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to modify this transaction") {
        googleUid
      }
    }
  }
  transaction_update(id: $transactionId, data: {
    amountMinor: $amountMinor
    direction: $direction
    occurredOn: $occurredOn
    description: $description
    merchant: $merchant
    method: $method
    recurrence: $recurrence
    categoryName: null
    source: $source
    status: $status
  })
}

# ─────────────────────────────────────────────────────────────────────────────
# Projected -> actual
# ─────────────────────────────────────────────────────────────────────────────
#
# Two mutations with the status written as a literal, rather than one taking
# `$status: String!`. The column is free text with no CHECK constraint behind
# it (Data Connect offers none), so a status variable is a hole through which
# any string reaches the database — and every read would then have to cope
# with a value the app has no meaning for. Naming the two transitions closes
# it: the only statuses that can ever be written are the two that exist.
#
# Note neither touches `source`. A projection that has been received keeps
# source "FORECAST", which is what preserves the fact that it began as a
# projection — see the note on Transaction.status in schema.gql.

# "That paycheque arrived" / "I paid that bill."
mutation MarkTransactionPosted($transactionId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    transaction(key: { id: $transactionId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to modify this transaction") {
        googleUid
      }
    }
  }
  transaction_update(id: $transactionId, data: { status: "POSTED" })
}

# The undo. Marking something as received is one tap, so un-marking it has to
# be one tap too — otherwise the only way back from a mis-tap is to delete the
# row and retype it.
mutation MarkTransactionProjected($transactionId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    transaction(key: { id: $transactionId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to modify this transaction") {
        googleUid
      }
    }
  }
  transaction_update(id: $transactionId, data: { status: "FORECASTED" })
}

# A hard delete, unlike DeleteFamilyMember. A transaction is a leaf row with
# nothing hanging off it, and an accidentally-added row is noise the user
# wants gone rather than hidden.
mutation DeleteTransaction($transactionId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    transaction(key: { id: $transactionId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to delete this transaction") {
        googleUid
      }
    }
  }
  transaction_delete(id: $transactionId)
}

# ─────────────────────────────────────────────────────────────────────────────
# Families (pattern 2 throughout — every one of these takes an id)
# ─────────────────────────────────────────────────────────────────────────────
#
# READ THIS BEFORE EDITING ANY MUTATION IN THIS SECTION.
#
# The guards here differ from the ones above in a way that matters. Elsewhere
# the checked row and the written row are the same row, so a missing @check is
# mitigated by the write simply matching nothing — `familyMember_update(id:
# $x)` on somebody else's id is a cross-tenant write, but on a *nonexistent*
# id it is a no-op.
#
# That is not true here. ApproveJoinRequest checks a FamilyJoinRequest and
# then writes a *User* row named by a different variable. If the guard query
# returns no row, its nested @checks never evaluate — there is nothing for
# them to evaluate against — and the write would proceed unguarded. That is
# the difference between "approve a request somebody made" and "drag any
# account in the system into my household without asking them".
#
# Hence the `@check(expr: "this != null")` on the TOP-LEVEL guard field in
# every mutation below. Absence of a row must be a denial, never a silence.
# Do not remove it, and do not add a mutation to this section without it.

# Creates a household and makes the caller its primary user.
#
# $familyId and $inviteCode are both generated client-side — the id with
# crypto.randomUUID for the same reason CreateFamilyMember does it (the
# caller can route into the app without a second round trip), and the code by
# lib/inviteCode.ts, which must use a CSPRNG. See the note on
# Family.inviteCode in schema.gql: the code is a capability, so a predictable
# one is a way into somebody's household.
#
# The `this.family == null` half of the check is not a UI nicety. Without it
# this mutation would happily point an account that is already in a household
# at a brand-new one, orphaning the old family if they owned it and silently
# removing them from it if they did not.
mutation CreateFamily(
  $userId: UUID!
  $familyId: UUID!
  $name: String!
  $inviteCode: String!
) @auth(level: USER) @transaction {
  query @redact {
    user(key: { id: $userId }) @check(
      expr: "this != null && this.googleUid == auth.uid && this.family == null"
      message: "Not authorized, or this account already belongs to a household"
    ) {
      googleUid
      family { id }
    }
  }
  family_insert(data: {
    id: $familyId
    name: $name
    inviteCode: $inviteCode
    ownerUserId: $userId
  })
  user_update(id: $userId, data: { familyId: $familyId })
}

# Asks to join a household the caller has the invite code for.
#
# _upsert rather than _insert: the row is keyed on (family, requester), so
# asking twice updates one row instead of queueing two identical asks in
# front of the owner. `decidedAt: null` and a refreshed `createdAt` are what
# make a re-ask after a denial read as a new request rather than as a stale
# decided one.
#
# Note what this does NOT do: it does not put the requester in the family.
# Only ApproveJoinRequest does that, and only the owner can call it.
mutation RequestToJoinFamily($userId: UUID!, $familyId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    user(key: { id: $userId }) @check(
      expr: "this != null && this.googleUid == auth.uid && this.family == null"
      message: "Not authorized, or this account already belongs to a household"
    ) {
      googleUid
      family { id }
    }
  }
  familyJoinRequest_upsert(data: {
    familyId: $familyId
    requesterId: $userId
    status: "PENDING"
    createdAt_expr: "request.time"
    decidedAt: null
  })
}

# Admits a requester into the household. Owner-only.
#
# Three things must all hold, and each one is a real attack or a real bug if
# dropped:
#
#   this != null        — see the section header. Without it, any signed-in
#                         account could name any other account and pull it
#                         into their household.
#   status == PENDING   — stops an already-decided request from being
#                         replayed, which would re-admit somebody who has
#                         since left or been denied.
#   owner is the caller — the actual authorization check.
#
# The requester's own `family == null` check is what keeps two owners from
# racing to approve the same person into different households; the loser's
# transaction aborts rather than silently moving them.
mutation ApproveJoinRequest($familyId: UUID!, $requesterId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    familyJoinRequest(key: { familyId: $familyId, requesterId: $requesterId }) @check(
      expr: "this != null"
      message: "No such join request"
    ) {
      status @check(
        expr: "this == 'PENDING'"
        message: "That join request is no longer pending"
      )
      family {
        ownerUser @check(
          expr: "this != null && this.googleUid == auth.uid"
          message: "Only the household's primary user can approve join requests"
        ) {
          googleUid
        }
      }
      requester @check(
        expr: "this != null && this.family == null"
        message: "That account has already joined a household"
      ) {
        family { id }
      }
    }
  }
  familyJoinRequest_update(
    key: { familyId: $familyId, requesterId: $requesterId }
    data: { status: "APPROVED", decidedAt_expr: "request.time" }
  )
  user_update(id: $requesterId, data: { familyId: $familyId })
}

# Turns a request down. Owner-only, and deliberately not a delete — the row
# stays so the requester's onboarding can tell them they were declined
# instead of showing them a request that silently vanished.
mutation DenyJoinRequest($familyId: UUID!, $requesterId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    familyJoinRequest(key: { familyId: $familyId, requesterId: $requesterId }) @check(
      expr: "this != null"
      message: "No such join request"
    ) {
      status @check(
        expr: "this == 'PENDING'"
        message: "That join request is no longer pending"
      )
      family {
        ownerUser @check(
          expr: "this != null && this.googleUid == auth.uid"
          message: "Only the household's primary user can deny join requests"
        ) {
          googleUid
        }
      }
    }
  }
  familyJoinRequest_update(
    key: { familyId: $familyId, requesterId: $requesterId }
    data: { status: "DENIED", decidedAt_expr: "request.time" }
  )
}

# Withdraws the caller's own pending request, so somebody who typed the wrong
# code — or got tired of waiting — can create their own household instead of
# being stuck on the waiting screen. Checks the requester is the caller, not
# that the caller owns the family: this is the one operation on a join
# request that belongs to the person who made it.
mutation CancelMyJoinRequest($familyId: UUID!, $userId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    familyJoinRequest(key: { familyId: $familyId, requesterId: $userId }) @check(
      expr: "this != null"
      message: "No such join request"
    ) {
      status @check(
        expr: "this == 'PENDING'"
        message: "That join request is no longer pending"
      )
      requester @check(
        expr: "this != null && this.googleUid == auth.uid"
        message: "Not authorized to cancel this join request"
      ) {
        googleUid
      }
    }
  }
  familyJoinRequest_update(
    key: { familyId: $familyId, requesterId: $userId }
    data: { status: "CANCELLED", decidedAt_expr: "request.time" }
  )
}

# Leaves the household. The member keeps every transaction, family member and
# connected account they created — those belong to the User row, not to the
# Family (see schema.gql) — and simply stops being visible to the people they
# left. That is the payoff of not hanging tenancy off the rows themselves.
#
# The primary user cannot leave. Family.ownerUser is non-null, so there is no
# "ownerless household" state to leave behind, and reassigning ownership is a
# feature that does not exist yet. Blocking it is honest; silently deleting
# everybody else's household would not be.
mutation LeaveMyFamily($userId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    user(key: { id: $userId }) @check(
      expr: "this != null && this.googleUid == auth.uid"
      message: "Not authorized"
    ) {
      googleUid
      family @check(
        expr: "this != null && this.ownerUser.googleUid != auth.uid"
        message: "The household's primary user cannot leave it"
      ) {
        ownerUser { googleUid }
      }
    }
  }
  user_update(id: $userId, data: { familyId: null })
}

# Rotates the invite code. Owner-only.
#
# An invite code is a bearer capability with no expiry — anyone holding it
# can ask to join forever. Once it has been read over somebody's shoulder or
# pasted into the wrong thread, the only remedy is a new one, so this is
# hygiene rather than a nice-to-have. Outstanding PENDING requests are
# untouched: they were already made, and the owner can still deny them.
mutation RegenerateFamilyInviteCode($familyId: UUID!, $inviteCode: String!) @auth(level: USER) @transaction {
  query @redact {
    family(key: { id: $familyId }) @check(
      expr: "this != null"
      message: "No such household"
    ) {
      ownerUser @check(
        expr: "this != null && this.googleUid == auth.uid"
        message: "Only the household's primary user can change the invite code"
      ) {
        googleUid
      }
    }
  }
  family_update(id: $familyId, data: { inviteCode: $inviteCode })
}


# Backfills the settings row for an account created before CreateUserFromGoogle
# nested one (see the note there). Called only by sync-user, only after it has
# established the row is genuinely absent.
#
# NO_ACCESS, and not because the operation is dangerous — it writes a row of
# defaults — but because it takes a $userId. A USER-level version would let a
# caller name somebody else's account, and while the worst outcome is a
# duplicate-key error, "it takes an id and has no @check" is precisely the
# shape this file exists to keep out. The route has a verified uid; it resolves
# that to the id itself.
#
# The empty data object leans on the column defaults in schema.gql, exactly as
# the nested insert in CreateUserFromGoogle does, so a new preference added to
# the table is picked up by both paths without either being edited.
mutation CreateUserSettingForUser($userId: UUID!) @auth(level: NO_ACCESS) {
  userSetting_insert(data: { userId: $userId })
}

# Backfills the self entry for an account created before CreateUserFromGoogle
# made one. NO_ACCESS for the same reason as its neighbour: it takes a
# $userId, and the route resolves that from a verified token itself.
#
# The @unique on selfUser means a duplicate attempt fails on the constraint
# rather than producing a second self row, so the caller can treat that one
# error as success — the same race the user and settings inserts already
# handle.
mutation CreateSelfFamilyMemberForUser(
  $userId: UUID!
  $familyMemberId: UUID!
  $name: String!
) @auth(level: NO_ACCESS) {
  familyMember_insert(data: {
    id: $familyMemberId
    userId: $userId
    selfUserId: $userId
    name: $name
    relationship: "Self"
  })
}
