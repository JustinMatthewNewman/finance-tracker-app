# Every operation here declares an @auth level, and the level IS the security
# boundary — not the UI that calls it.
#
#   USER       — reachable from the browser, and scoped by auth.uid in its own
#                where clause. A client can only ever read its own rows.
#   NO_ACCESS  — unreachable from the browser. Called only from a route
#                handler through the admin SDK, after that route has verified
#                the caller's ID token (see lib/featureAccess.ts).
#
# A query that returns another account's data must be NO_ACCESS. There is no
# third option where the client is trusted to pass the right userId.

# ─────────────────────────────────────────────────────────────────────────────
# Tier administration — NO UI YET, AND THAT IS DELIBERATE
# ─────────────────────────────────────────────────────────────────────────────
#
# ListUsers, ListUserTypes and SetUserType (in mutations.gql) are the read and
# write halves of an admin surface that has not been built. They are kept
# rather than deleted because the tier system they serve is kept — see
# README's "Making yourself an admin", which documents SetUserType as the
# promotion path today.
#
# If tiers get dropped later, these three go with them.

# Server-side only: the full account list, for administrative tooling.
query ListUsers @auth(level: NO_ACCESS) {
  users {
    id
    googleUid
    username
    email
    userTypeName
    createdAt
  }
}

# The one query the whole client-side settings layer is built on. Returns the
# signed-in account's preferences AND its capability set in a single round
# trip, which is why context/UserSettingsContext.tsx and hooks/useFeatures.ts
# can both read from it without either issuing a second fetch.
#
# Scoped by auth.uid, so "my user" is decided by the verified token and never
# by a variable the caller supplies.
query GetMyUser @auth(level: USER) {
  # `first: { where: ... }`, not `key:` — User is keyed on its UUID `id`,
  # and googleUid is merely @unique, so it is not addressable as a key.
  user(first: { where: { googleUid: { eq_expr: "auth.uid" } } }) {
    id
    googleUid
    username
    email
    createdAt
    userSetting: userSetting_on_user {
      id
      performanceMode
      backgroundOpacity
      externalAccountLinkTemplate
      cardOpacity
      cardBlur
      bordersEnabled
      categoryColorsEnabled
      squareCorners
      currencyCode
      colorScheme {
        id
        name
      }
    }
    userType {
      name
      features: features_via_UserTypeFeature {
        name
        description
      }
    }
    # Null until the person finishes onboarding. That null IS the signal the
    # onboarding gate reads (see components/Onboarding/OnboardingGate.tsx) —
    # it is not an error state, it is "has not chosen a household yet", and
    # it rides along on the fetch every page already makes rather than
    # costing a query of its own.
    #
    # inviteCode is included because the Family panel in Settings shows it to
    # every member so any of them can invite. It is a secret from everyone
    # outside the household, and this query only ever returns the caller's
    # own family, so that holds.
    family {
      id
      name
      inviteCode
      # "Am I the primary user" is `family.ownerUser.id == user.id`, both of
      # which are in this one response. Deliberately not a role column on
      # User — see the Family.ownerUser note in schema.gql.
      ownerUser {
        id
        username
      }
    }
  }
}

# Every scheme with both of its variants, for the Settings page's theme
# picker. USER rather than PUBLIC only because there is no reason for a
# signed-out visitor to fetch it — the rows themselves are not sensitive.
query ListColorSchemes @auth(level: USER) {
  colorSchemes(orderBy: { name: ASC }) {
    id
    name
    themes: themes_on_colorScheme {
      id
      isDark
      background
      foreground
      surface
      surfaceForeground
      overlay
      overlayForeground
      muted
      default
      defaultForeground
      accent
      accentForeground
      border
      separator
    }
  }
}

query ListUserTypes @auth(level: USER, insecureReason: "Tiers are non-sensitive public metadata") {
  userTypes(orderBy: { name: ASC }) {
    id
    name
    createdAt
  }
}

# Backs requireFeature() in lib/featureAccess.ts — the server-side half of
# feature gating. NO_ACCESS because it takes a googleUid as a variable: if the
# client could call it, it could pass somebody else's uid and read their tier.
# The route resolves that uid from a verified token instead.
query GetUserAccessByGoogleUid($googleUid: String!) @auth(level: NO_ACCESS) {
  user(first: { where: { googleUid: { eq: $googleUid } } }) {
    id
    username
    userType {
      name
      features: features_via_UserTypeFeature {
        name
      }
    }
  }
}

# The provisioning state of one account, for app/api/auth/sync-user/route.ts.
#
# Distinct from GetUserAccessByGoogleUid above, which answers "what may this
# person do" for feature gating. This one answers "is this account fully set
# up", and it returns the settings row's id and nothing else from it — the
# route only needs to know whether it is there.
#
# NO_ACCESS for the same reason its neighbour is: it takes a googleUid as a
# variable, so a browser able to call it could probe other accounts.
query GetUserProvisioningByGoogleUid($googleUid: String!) @auth(level: NO_ACCESS) {
  user(first: { where: { googleUid: { eq: $googleUid } } }) {
    id
    username
    userSetting: userSetting_on_user {
      id
    }
    # The account's own entry in its household. Absent only for accounts
    # created before CreateUserFromGoogle made one; sync-user backfills it.
    selfMember: familyMember_on_selfUser {
      id
    }
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# Household
# ─────────────────────────────────────────────────────────────────────────────
#
# THE VISIBILITY RULE, WHICH EVERY READ BELOW REPEATS VERBATIM:
#
#   _or: [
#     { user: { googleUid: { eq_expr: "auth.uid" } } }
#     { user: { family: { users_on_family: { exist: { googleUid: { eq_expr: "auth.uid" } } } } } }
#   ]
#
# It appears wrapped in an `_and` wherever the query also filters on an
# ordinary column. That is not stylistic: Data Connect rejects a filter that
# mixes `_or` with sibling field predicates outright —
#   "cannot mix _and/_or/_not with specific fields [_or] and [isDeleted]"
# — so the scalar predicates have to become `_and` entries alongside it.
#
# "A row is mine, OR its owner is in a household I am also in." Read the
# second clause from the inside out: find the row's owner, walk to that
# owner's family, and require that family to have a member whose googleUid is
# the verified caller's. It is a correlated EXISTS, and it takes no variable
# at all — there is no family id for a caller to substitute, exactly like the
# `eq_expr: "auth.uid"` scoping it extends.
#
# WHY BOTH CLAUSES, when the second looks like it subsumes the first. It does
# not, and dropping the first is a real regression rather than a tidy-up: a
# user who has not finished onboarding has User.family = NULL, the forward
# filter through a null FK matches nothing, and they would stop being able to
# see their OWN data. Every account is in that state between signing in and
# choosing a household.
#
# WRITES ARE NOT WIDENED. Reads go to the household; authorship does not. The
# @check guards in mutations.gql still ask "is this your row", so a row
# belonging to a housemate is visible and read-only. That asymmetry is
# deliberate (see the Family type in schema.gql), and it is why every query
# here also selects the owning `user` — the UI has to know which rows it must
# not offer to edit.

# The finance page's sidebar. Scoped to the caller and filtered to
# non-deleted members — DeleteFamilyMember is a soft delete (see the schema),
# so without this filter removed people keep appearing in the list.
#
# `isDeleted: { eq: false }` rather than `ne: true`: the column is nullable,
# and in SQL `NULL <> true` is NULL, not true — so a row written before the
# column existed would be silently filtered out by the `ne` form.
query ListFamilyMembers($limit: Int = 500, $offset: Int = 0) @auth(level: USER) {
  familyMembers(
    where: {
      _and: [
          { isDeleted: { eq: false } }
          {
            _or: [
              { user: { googleUid: { eq_expr: "auth.uid" } } }
              { user: { family: { users_on_family: { exist: { googleUid: { eq_expr: "auth.uid" } } } } } }
            ]
          }
        ]
    }
    orderBy: [{ createdAt: ASC }]
    limit: $limit
    offset: $offset
  ) {
    id
    name
    relationship
    color
    externalAccountRef
    monthlyIncomeTargetMinor
    createdAt
    # Which account created this row, so the UI can mark what it must not
    # offer to edit. See "WRITES ARE NOT WIDENED" above.
    user {
      id
      username
    }
    # Non-null on the one row that represents an account itself. The sidebar
    # selects the caller's own entry by default and labels it; housemates'
    # self entries carry their id, not the caller's, so comparing against
    # this is what distinguishes "me" from "another account in my household".
    selfUser {
      id
    }
  }
}

# The shared category lookup, for the transaction form's picker and for
# resolving a category's color when rendering a breakdown.
query ListCategories($limit: Int = 500, $offset: Int = 0) @auth(level: USER) {
  categories(orderBy: [{ name: ASC }], limit: $limit, offset: $offset) {
    id
    name
    kind
    parentGroup
    color
    createdAt
  }
}

# The main panel: one family member's transactions.
#
# Scoped by auth.uid on the transaction itself (not only through
# familyMember), so passing another household's memberId returns nothing
# rather than their data. Belt and braces, but the cost is one indexed
# predicate and the failure mode it prevents is a cross-household leak.
query ListTransactionsByFamilyMember(
  $familyMemberId: UUID!
  $limit: Int = 500
  $offset: Int = 0
) @auth(level: USER) {
  transactions(
    where: {
      _and: [
          { familyMemberId: { eq: $familyMemberId } }
          {
            _or: [
              { user: { googleUid: { eq_expr: "auth.uid" } } }
              { user: { family: { users_on_family: { exist: { googleUid: { eq_expr: "auth.uid" } } } } } }
            ]
          }
        ]
    }
    orderBy: [{ occurredOn: DESC }, { createdAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    amountMinor
    direction
    occurredOn
    description
    merchant
    method
    recurrence
    source
    status
    createdAt
    familyMember {
      id
      name
    }
    category {
      id
      name
      kind
      color
    }
    # Which account created this row, so the UI can mark what it must not
    # offer to edit. See "WRITES ARE NOT WIDENED" above.
    user {
      id
      username
    }
  }
}

# Every transaction in the household, for the global search index and for
# household-wide totals across all members.
query ListMyTransactions($limit: Int = 500, $offset: Int = 0) @auth(level: USER) {
  transactions(
    where: {
      _or: [
        { user: { googleUid: { eq_expr: "auth.uid" } } }
        { user: { family: { users_on_family: { exist: { googleUid: { eq_expr: "auth.uid" } } } } } }
      ]
    }
    orderBy: [{ occurredOn: DESC }, { createdAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    amountMinor
    direction
    occurredOn
    description
    merchant
    method
    recurrence
    source
    status
    createdAt
    familyMember {
      id
      name
    }
    category {
      id
      name
      kind
      color
    }
    # Which account created this row, so the UI can mark what it must not
    # offer to edit. See "WRITES ARE NOT WIDENED" above.
    user {
      id
      username
    }
  }
}

# Date-bounded variant, for the month the main panel is showing. Both bounds
# are inclusive.
query ListMyTransactionsByDateRange(
  $startDate: Date!
  $endDate: Date!
  $limit: Int = 500
  $offset: Int = 0
) @auth(level: USER) {
  transactions(
    where: {
      _and: [
          { occurredOn: { ge: $startDate, le: $endDate } }
          {
            _or: [
              { user: { googleUid: { eq_expr: "auth.uid" } } }
              { user: { family: { users_on_family: { exist: { googleUid: { eq_expr: "auth.uid" } } } } } }
            ]
          }
        ]
    }
    orderBy: [{ occurredOn: DESC }, { createdAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    amountMinor
    direction
    occurredOn
    description
    merchant
    method
    recurrence
    source
    status
    createdAt
    familyMember {
      id
      name
    }
    category {
      id
      name
      kind
      color
    }
    # Which account created this row, so the UI can mark what it must not
    # offer to edit. See "WRITES ARE NOT WIDENED" above.
    user {
      id
      username
    }
  }
}



# ─────────────────────────────────────────────────────────────────────────────
# Families
# ─────────────────────────────────────────────────────────────────────────────

# Resolves an invite code the person typed during onboarding, so the UI can
# ask "Join the Newmans?" instead of making them confirm an opaque code.
#
# THIS QUERY DISCLOSES A HOUSEHOLD NAME TO ANYONE HOLDING ITS CODE, and that
# is the intended bargain rather than an oversight: the code is the
# capability (see Family.inviteCode in schema.gql), so knowing it is already
# enough to ask to join. What the query deliberately does NOT return is
# anything about the household's members or their money — resolving a code
# gets you a name and the right to knock, nothing else.
#
# There is no query anywhere that lists families. Codes are unguessable and
# un-enumerable by design; adding a `families(...)` list here would undo
# that in one line.
query GetFamilyByInviteCode($inviteCode: String!) @auth(level: USER) {
  family(first: { where: { inviteCode: { eq: $inviteCode } } }) {
    id
    name
    ownerUser {
      username
    }
  }
}

# The Family panel in Settings: who is in the household, and who is asking to
# be.
#
# Scoped by "a family I am a member of", with no family id variable — the
# same correlated EXISTS the household reads use, for the same reason. A
# `$familyId` parameter here would be a way to read any household's roster.
query GetMyFamilyDetail @auth(level: USER) {
  families(
    where: { users_on_family: { exist: { googleUid: { eq_expr: "auth.uid" } } } }
    limit: 1
  ) {
    id
    name
    inviteCode
    createdAt
    ownerUser {
      id
      username
    }
    members: users_on_family(orderBy: [{ createdAt: ASC }]) {
      id
      username
      email
      createdAt
    }
    # Visible to every member, not only the owner, though only the owner can
    # act on them (see ApproveJoinRequest). Showing a housemate that somebody
    # is knocking is not a disclosure worth a second query to prevent — but
    # the approve/deny buttons are the owner's alone, in the UI and, more to
    # the point, in the guard.
    pendingRequests: familyJoinRequests_on_family(
      where: { status: { eq: "PENDING" } }
      orderBy: [{ createdAt: ASC }]
    ) {
      status
      createdAt
      requester {
        id
        username
        email
      }
    }
  }
}

# Backs the onboarding waiting screen. Returns the caller's own requests in
# any state, newest first, because "declined" has to be tellable from "still
# waiting" — a denied request that simply disappeared would leave somebody
# staring at a spinner forever with no idea they had been turned down.
query GetMyJoinRequests @auth(level: USER) {
  familyJoinRequests(
    where: { requester: { googleUid: { eq_expr: "auth.uid" } } }
    orderBy: [{ createdAt: DESC }]
    limit: 10
  ) {
    status
    createdAt
    decidedAt
    family {
      id
      name
      ownerUser {
        username
      }
    }
  }
}
