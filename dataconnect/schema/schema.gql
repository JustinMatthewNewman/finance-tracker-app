# The fixed set of account tiers (Admin, Guest, Regular, Elevated, Premium),
# referenced by User.userType. Keyed on `name` rather than a UUID for the same
# reason Category is keyed on `name`: the natural key makes userType_upsert
# idempotent by name, and it keeps User's foreign key column readable
# ("Regular") instead of an opaque UUID.
#
# Deliberately names-only for now — feature gating keys off `name` in app code.
# Per-tier config columns (maxHouseholdMembers, canExportData, ...) can be
# added here later without touching User.
#
# WARNING — never DELETE a row from this table. Data Connect derives ON DELETE
# from nullability and gives no override, so User.userType being a required
# reference makes it ON DELETE CASCADE: dropping a tier here deletes every User
# holding it, and FamilyMember.user / Transaction.user cascade in turn, taking
# those users' household members and transactions with them. Add tiers; never
# remove one.
type UserType @table(key: "name") {
  id: UUID! @default(expr: "uuidV4()") @unique
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A named application capability that can be granted to tiers — e.g.
# "AdminPage". Gating on a Feature row rather than on a hardcoded
# `userType.name == "Admin"` check means granting or revoking access is a data
# change, not a code change: a second tier can be handed a capability without
# touching a component, and a feature can be dark-launched by simply not
# granting it to anyone yet.
#
# Keyed on `name` for the same readability reason as UserType.
type Feature @table(key: "name") {
  id: UUID! @default(expr: "uuidV4()") @unique
  name: String!
  description: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# Cross-reference granting a Feature to a UserType. Composite key means one
# row per (tier, feature), so grants are idempotent to upsert and can't
# duplicate.
#
# Generates `userType.features_via_UserTypeFeature`, which is what GetMyUser
# reads to hand the client its whole capability set in one round trip.
#
# Deliberately keyed to UserType, not User — permissions live on the tier.
# Per-user overrides, if ever needed, belong in a separate UserFeature xref
# rather than by blurring this one.
type UserTypeFeature @table(key: ["userType", "feature"]) {
  userType: UserType!
  feature: Feature!
  createdAt: Timestamp! @default(expr: "request.time")
}

# The signed-in account. In this app a User is the *household* — the person
# who signs in — and the people whose money is being tracked are FamilyMember
# rows beneath it. That distinction matters: a family member is not an account
# and never signs in, so it has no googleUid and no tier of its own.
type User @table {
  id: UUID! @default(expr: "uuidV4()")
  googleUid: String! @unique
  username: String!
  email: String
  # Every user has exactly one tier — non-null, no default tier at the GraphQL
  # level beyond the column default below.
  #
  # The FK scalar is declared explicitly (rather than letting a bare
  # `userType: UserType!` generate an implicit one) purely so it can carry
  # @default: that default is what backfills every pre-existing user to
  # "Regular" when the NOT NULL column is added.
  #
  # The default alone is NOT enough on a database that already has users —
  # Data Connect adds the column and its FK constraint in one statement, so the
  # "Regular" row must already be in user_type or the migration aborts with a
  # foreign key violation. See the two-phase rollout note on SeedUserTypes in
  # dataconnect/seed_data.gql.
  userType: UserType! @ref(fields: "userTypeName", references: "name")
  userTypeName: String! @default(value: "Regular")

  # The family this account belongs to, or null if it has not joined or
  # created one yet — exactly the state the onboarding flow exists to
  # resolve (see app/(onboarding)/).
  #
  # Nullable is load-bearing rather than lazy. sync-user creates a User row
  # the instant Firebase Auth accepts a sign-in, which is strictly before
  # the person has had any chance to choose a family. A non-null column
  # would force sync-user to invent one for everybody, including the people
  # who signed in specifically to join an existing household, and every one
  # of those inventions would be an orphan family nobody asked for.
  #
  # ONE FAMILY PER ACCOUNT, enforced structurally by this being a scalar FK
  # rather than a membership cross-reference table. That is a deliberate
  # trade: it makes "can I see this row" a two-hop question (row -> owner ->
  # family) instead of a four-hop one, on every read in the app, forever. A
  # FamilyMembership xref would buy accounts in several families at once,
  # which nothing in the product asks for.
  family: Family

  createdAt: Timestamp!
}

# A household group: the set of accounts that can see each other's finances.
#
# WHAT A FAMILY DOES AND DOES NOT OWN. It owns no financial data. Every
# Transaction and FamilyMember still belongs to the
# User who created it, and every write is still guarded by "is this your
# row", unchanged. What a family changes is *reads*: a row is visible to you
# if you own it, OR if its owner is in your family. That asymmetry — shared
# visibility, unshared authorship — is the whole design, and it is why no
# financial table has a foreign key pointing at this one.
#
# Do not "simplify" that later by hanging a familyId off Transaction. Once a
# row's tenancy lives on the row itself, changing families rewrites history,
# and a person who leaves takes with them an unanswerable question about
# which rows were ever really theirs.
type Family @table {
  id: UUID! @default(expr: "uuidV4()")
  # User-authored display name ("The Newmans"). Deliberately not unique and
  # not a key: two unrelated households may pick the same name with no
  # conflict, because the invite code — not the name — is what identifies a
  # family to somebody joining it.
  name: String!

  # The shared secret that makes joining possible.
  #
  # This is a capability, not an identifier: holding it is what authorizes a
  # request to join, so it must be unguessable. lib/inviteCode.ts generates
  # 10 Crockford base32 characters (~50 bits, with the visually ambiguous
  # letters removed) from a CSPRNG. Never derive one from the family name,
  # the owner, or a counter.
  #
  # @unique because GetFamilyByInviteCode resolves a code to exactly one
  # family; a duplicate would silently hand a joiner the wrong household.
  inviteCode: String! @unique

  # The "household primary user" — the single account that can approve or
  # deny join requests.
  #
  # Authoritative and singular by construction. The alternative, a role
  # column on each member, can drift into a family with two owners or none,
  # and then every approval path needs a tie-breaker for a state that should
  # not be representable.
  #
  # CASCADE WARNING, the same class of hazard as the UserType note above.
  # Non-null makes this ON DELETE CASCADE: deleting the owner's User row
  # deletes the Family, which in turn nulls every remaining member's
  # User.family (nullable, so ON DELETE SET NULL). Those members lose no
  # data — their transactions are their own and untouched, and they land
  # back in onboarding — but they are silently ejected. Nothing in the app
  # deletes an account today. If that ever changes, ownership must be
  # reassigned first.
  ownerUser: User!

  createdAt: Timestamp! @default(expr: "request.time")
}

# A pending, approved or denied ask from one account to join one family.
#
# Keyed on (family, requester) rather than on a UUID, for the same reason
# UserTypeFeature is: the natural key makes the row idempotent to upsert, so
# somebody tapping "Request to join" twice — or asking again after being
# denied — updates one row instead of filling the owner's queue with
# duplicates that all say the same thing.
#
# `status` is text because Data Connect has no enum table or CHECK
# constraint to hang one on. The four legal values are "PENDING",
# "APPROVED", "DENIED" and "CANCELLED", validated in lib/familyStatus.ts and
# nowhere else — the same arrangement as Transaction.direction.
#
# The row is NOT deleted on approval, deliberately. Keeping it is what gives
# a household an audit trail of who joined when, and it means somebody who
# leaves and comes back updates one row rather than resurrecting a deleted
# one.
type FamilyJoinRequest @table(key: ["family", "requester"]) {
  family: Family!
  requester: User!
  status: String! @default(value: "PENDING")
  createdAt: Timestamp! @default(expr: "request.time")
  # Null for as long as the request is PENDING. The approve/deny mutations
  # set it from `request.time`, never from a client-supplied timestamp.
  decidedAt: Timestamp
}

# Dedicated per-account display preferences table, decoupled from user identity.
# 1-to-1 relationship with User via `user: User! @unique`.
type UserSetting @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User! @unique
  colorScheme: ColorScheme
  performanceMode: Boolean @default(expr: "false")
  backgroundOpacity: Int @default(expr: "100")
  externalAccountLinkTemplate: String
  cardOpacity: Int @default(expr: "100")
  cardBlur: Int @default(expr: "0")
  bordersEnabled: Boolean @default(expr: "true")
  categoryColorsEnabled: Boolean @default(expr: "true")
  squareCorners: Boolean @default(expr: "false")
  currencyCode: String @default(value: "USD")

  # Hide Saturday and Sunday on the calendar, dropping it to a five-column grid.
  # For households whose money is entirely weekday-shaped (salary, direct debits)
  # and who would rather have wider cells than two mostly-empty ones.
  #
  # A VIEW SETTING, NOT A FILTER. Weekend transactions still exist, still count
  # in every total, and still appear in the ledgers — the calendar simply stops
  # drawing those two columns. A toggle that quietly changed the month's total
  # would be a different and much worse feature.
  hideWeekends: Boolean @default(expr: "false")

  # Whether money moved between the household's own accounts counts as income
  # and spending.
  #
  # Defaults TRUE, which is the plain reading of a statement: the lines are on
  # it. The reason to turn it off is that each transfer adds the same amount to
  # both sides, so a household that sweeps money into savings appears to earn and
  # spend far more than it does — the net is untouched, which is exactly why the
  # distortion is easy to miss. See Transaction.isInternalTransfer.
  showInternalTransfers: Boolean @default(expr: "true")

  # Replace every amount on screen with dots.
  #
  # For working in public, sharing a screen, or a screenshot. Persisted rather
  # than kept in component state so it survives a reload and follows the account
  # to another device — somebody who turned it on for a reason should not have it
  # silently off after a refresh.
  #
  # NOT A SECURITY BOUNDARY, and worth saying so: the amounts are still in the
  # page, still in the network responses and still in the DOM. It defeats a
  # person glancing over, which is what it is for.
  privacyMode: Boolean @default(expr: "false")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A person in the household whose income and expenses are tracked — the entity
# the finance page's sidebar lists and selects between.
#
# This is the structural counterpart of the source template's WorkLog: the
# sidebar-selected parent that the main panel's detail view hangs off. It
# differs in one important way, and the difference drives the whole page. A
# work log was scoped to a single day, so the sidebar grouped by week and
# paged through time. A family member is permanent, so the sidebar is a flat
# list and the *main panel* owns the date range instead.
#
# Keyed on the default UUID rather than on `name`: this is user-authored data
# that people rename casually ("Mom" -> "Sarah"), so identity lives in an
# immutable id and renaming stays a plain update rather than a data migration.
type FamilyMember @table {
  id: UUID! @default(expr: "uuidV4()")
  # Who OWNS this record — the account that created it and is the only one
  # allowed to change it. Not "who this person is": see selfUser below.
  user: User!

  # Set only on the one row that represents the signed-in account itself.
  #
  # WHY THIS EXISTS. A User is an account and a FamilyMember is a person whose
  # money is tracked, and the two were entirely disjoint — so the person doing
  # the tracking was the one person in the household not represented in it.
  # A new account landed on an empty sidebar and had to add itself by hand
  # before it could record anything, which reads as the app being broken
  # rather than as a step.
  #
  # Created with the User, in the same transaction (see CreateUserFromGoogle),
  # so "every account appears in its own household" is true by construction
  # rather than by a UI remembering to do it.
  #
  # @unique is what makes that an invariant the database enforces: one self
  # row per account, no duplicates from a retried sign-in or a backfill racing
  # the insert. Nullable, and null is the normal case — every other member of
  # the household is somebody who does not sign in. Postgres permits many
  # NULLs under a unique index, so this constrains only the rows that set it.
  #
  # Nullable also makes it ON DELETE SET NULL rather than CASCADE, which is
  # the harmless direction: it is `user` above that owns the row's lifetime.
  selfUser: User @unique
  name: String!
  # Free text ("Spouse", "Daughter", "Self") rather than an enum table. There
  # is no application logic that branches on it — it's a label under the name
  # in the sidebar — and a fixed list would be wrong for somebody's household
  # the day it shipped.
  relationship: String
  # Identity color, same "#rrggbb" convention as Category.color. Nullable: a
  # member without one falls back to a derived color (see lib/entityColor.ts)
  # rather than being assigned one by a migration.
  color: String
  # Opaque reference used to build an outbound link with the household's
  # externalAccountLinkTemplate — e.g. an account number at their bank.
  # Nullable and purely a convenience; nothing in the app reads it except the
  # link builder.
  externalAccountRef: String
  # Monthly take-home this person is expected to bring in, in minor units.
  # Nullable because most households won't set one, and a default here would
  # invent a target nobody agreed to — attainment is simply not shown until
  # it is set.
  monthlyIncomeTargetMinor: Int
  # Soft delete, exactly as the template's WorkLog does it. A hard delete
  # would cascade to every Transaction the person ever had, which is
  # destructive in a way "remove from the sidebar" does not imply. Every
  # query filters on this.
  #
  # There is no restore mutation. That is not an oversight — this column
  # earns its keep purely by protecting transaction history from the cascade,
  # and an unreachable RestoreFamilyMember was deleted rather than left
  # sitting in the connector. Bringing somebody back is a one-line mutation
  # plus the UI to reach it, on the day that is wanted.
  isDeleted: Boolean @default(expr: "false")
  createdAt: Timestamp! @default(expr: "request.time")
}

# A spending or earning category ("Groceries", "Salary", "Rent"), keyed by its
# human-entered name so category_upsert can find-or-create a row for a given
# one. This is the structural counterpart of the template's Ticket: a shared
# lookup row that transactions point at, carrying the color and metadata that
# would otherwise be duplicated onto every transaction and drift.
type Category @table(key: "name") {
  id: UUID! @default(expr: "uuidV4()") @unique
  name: String!
  # "INCOME" or "EXPENSE" — which side of the ledger this category normally
  # belongs to, used to group the category pickers and the breakdown.
  #
  # Not a hard constraint on the transactions that reference it: a refund is
  # money coming *in* against a spending category, and that must stay
  # expressible. Transaction.direction is the authoritative per-row answer;
  # this is the category's default. Data Connect has no enum or CHECK
  # constraint to hang this on, so the two legal values are validated in
  # lib/money.ts and nowhere else.
  kind: String! @default(value: "EXPENSE")
  # Optional grouping above the category itself ("Housing" over "Rent" and
  # "Utilities"). Free text for the same reason FamilyMember.relationship is.
  parentGroup: String
  # User-chosen identity color for this category, as "#rrggbb". Surfaced
  # wherever the category appears — the breakdown tints each row with a muted
  # version of it.
  #
  # Lives on Category rather than per user, matching the template's Ticket: a
  # category is a shared lookup row, so its color is a property of the
  # category itself and stays consistent for everyone looking at it.
  #
  # Nullable, and null is a real state rather than a gap to backfill — it
  # means "no color chosen", and the UI falls back to a name-derived hue (see
  # lib/entityColor.ts). That fallback is why this needs no migration.
  #
  # Stored as text, not validated by the database. Data Connect has no CHECK
  # constraint to hang a hex pattern on, so validation lives in
  # lib/entityColor.ts and every read goes through it — a malformed value must
  # never reach a CSS color-mix(), which would silently drop the whole
  # declaration rather than just the color.
  color: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# One upload of one bank statement CSV — the header record for the rows it
# produced.
#
# WHY THIS TABLE EXISTS. Without it, "the transactions that came from that
# file" is not a thing the database can name: it is a set of rows that happen to
# share a source and a date range, and taking an upload back means reconstructing
# which rows those were from whatever the client still remembers. With it, an
# upload has an identity, every row it wrote points at that identity, and
# removing it is a filter on one column.
#
# TWO LEVELS OF DUPLICATE PROTECTION, ANSWERING TWO DIFFERENT QUESTIONS. They
# are not redundant and neither replaces the other:
#
#   `contentKey` here      — "is this the same FILE again?" Caught before a
#                            single row is written, which is what lets the
#                            dialog say "you uploaded this on 14 Sep" instead of
#                            importing a second copy of a month.
#   Transaction.importKey  — "is this the same LINE again?" Which is a different
#                            question, because the usual re-upload is not the
#                            same file: it is a wider date range that overlaps
#                            the last one. The file is new, most of its lines
#                            are not.
#
# NO CASCADE, DELIBERATELY. Transaction.statementImport below has to be nullable
# — almost no transaction comes from an upload — and Data Connect derives ON
# DELETE from nullability, so deleting a row here SETS NULL on its transactions
# rather than removing them. Removing an upload is therefore two mutations in
# order: the rows, then this. See DeleteStatementImportRows in mutations.gql.
# Getting that order wrong does not corrupt anything, but it does strand the
# rows with nothing pointing at them, and then only their importKeys can find
# them again.
type StatementImport @table {
  id: UUID! @default(expr: "uuidV4()")
  # Who uploaded it — the owner, in the same sense as Transaction.user, and what
  # every guard on this table checks.
  user: User!
  # Who the rows were attributed to. Denormalized from the transactions so the
  # list of uploads can say "Sarah's Checking" without reading any of them.
  familyMember: FamilyMember!

  # What the person called the account ("Checking", "Joint Savings"). Defaults
  # from the filename and is editable at upload time, because it is also part of
  # every row's importKey — two accounts with a payment of the same amount on
  # the same day are two transactions, and only this tells them apart.
  accountLabel: String!
  # The file's own name, kept as uploaded. Purely so somebody recognizes the row
  # a month later; nothing keys off it.
  filename: String!

  # Fingerprint of the file's CONTENTS, scoped to the uploader — a digest of the
  # text, not of the name. Renaming a file does not make it a different
  # statement, and Wells Fargo names every export the same thing anyway.
  #
  # @unique for the same reason Transaction.importKey is: the client checks this
  # list before uploading, but a read followed by a write is not a guarantee, and
  # the failure this prevents is a household's month of spending counted twice.
  # Nullable so the constraint constrains only rows that set it.
  contentKey: String @unique

  # What the file contained and what came of it. Stored rather than counted from
  # the transactions on demand, because the interesting numbers are the ones the
  # rows CANNOT answer: how many lines were skipped as already imported, and how
  # many were unreadable, are facts about the upload that left no row behind.
  rowCount: Int!
  importedRowCount: Int! @default(expr: "0")
  skippedRowCount: Int! @default(expr: "0")
  # The range the statement covered, for the list. Nullable because an upload
  # whose every line was unreadable has no range.
  earliestOccurredOn: Date
  latestOccurredOn: Date

  createdAt: Timestamp! @default(expr: "request.time")
}

# One movement of money, attributed to a family member. The template's
# TimeEntry in the same structural slot: the leaf row the main panel lists,
# groups and totals.
type Transaction @table {
  id: UUID! @default(expr: "uuidV4()")
  # Denormalized owner, so every query can scope by auth.uid without walking
  # through familyMember. Same shape as the template's TimeEntry.user.
  user: User!
  familyMember: FamilyMember!
  category: Category

  # MONEY IS AN INTEGER. Amounts are minor units of the household's currency
  # (cents for USD), never a float and never a GraphQL Float. Binary floating
  # point cannot represent 0.10, so summing a column of them drifts — and a
  # budget that is off by a cent after forty rows is worse than useless. Every
  # read and write goes through lib/money.ts, which is the only place that
  # converts between minor units and a display string.
  #
  # Always the POSITIVE magnitude. Which way the money moved is
  # `direction` below, not the sign — a signed amount makes every aggregate
  # ambiguous about whether it is a total or a net, and that ambiguity is
  # exactly what produces a "total expenses" figure quietly reduced by a
  # refund that nobody asked it to net out.
  amountMinor: Int!
  # "INCOME" or "EXPENSE". Authoritative per row, deliberately NOT derived
  # from category.kind: a refund is an INCOME row against a spending category,
  # and a payroll deduction is an EXPENSE row against an earning one. Denormal
  # on purpose — the alternative is that every total joins to Category and
  # still gets those two cases wrong.
  direction: String!

  occurredOn: Date!
  description: String
  # Counterparty — the shop, employer, or person. Free text; no Merchant
  # table, because nothing in the app needs merchant identity, only a label
  # to show and search on.
  merchant: String
  # How the money moved ("Card", "Cash", "Transfer"). Free text, display only.
  method: String
  # How often this repeats — "WEEKLY", "BIWEEKLY", "MONTHLY", "YEARLY". Null
  # means one-off. Validated in lib/recurrence.ts.
  #
  # ON A PROJECTION THIS IS EXECUTED, NOT JUST RECORDED. A projected row that
  # carries a recurrence is a RULE, not one entry: the app expands it into an
  # occurrence on every matching day of whatever range is on screen. The row
  # itself stores the FIRST occurrence in `occurredOn`.
  #
  # On a posted row it stays purely descriptive — "this was the monthly rent"
  # — because something that already happened happened once. Only projections
  # are expanded.
  recurrence: String

  # How long a recurring projection keeps appearing. Null means indefinitely.
  #
  # THIS IS THE ONE COLUMN THAT ANSWERS "how long should this show for", and
  # it is deliberately a property of the rule rather than a count of rows.
  #
  # The alternative was to materialise every occurrence as its own row at
  # creation time. That is worse in every direction that matters here: it
  # cannot express "indefinitely" at all (only "for N years", which is a lie
  # with a number attached), a five-year weekly bill becomes 260 rows, and
  # changing the end date turns into generating or deleting rows in bulk —
  # each one a partial-failure mode, and each bulk write a place where the
  # per-row ownership `@check` no longer applies. Expanding a single rule over
  # the visible range has none of those properties: one row, one edit, one
  # thing to delete, and a range nobody has to pre-decide.
  #
  # The cost, stated plainly: individual future occurrences are not rows, so
  # they cannot be edited or ticked off one at a time. That is the right
  # trade while these are forecasts. When Plaid starts writing actuals, the
  # job becomes matching a real transaction against an occurrence, and THAT
  # is when an occurrence needs its own identity.
  recurrenceEndsOn: Date

  # --- Projected vs. actual ---
  #
  # A row is either something that HAPPENED or something the household
  # EXPECTS to happen — an anticipated paycheque, a bill that is due. Both
  # live in this table rather than in a separate "projections" one, and that
  # is the single most important decision in this schema.
  #
  # The alternative — a ProjectedTransaction table beside this one — looks
  # tidier right up until you try to use it. Every total, every calendar day,
  # every category breakdown and every search would have to read both tables
  # and union them, and each of those is a place to forget one. Worse, the
  # eventual job of reconciling a projection against the real transaction
  # that fulfils it becomes a cross-table migration of a row rather than a
  # change of one column.
  #
  # This also happens to be what a future Plaid import needs: it writes rows
  # here with source "PLAID", and they are the same shape as everything else
  # the app already renders. Nothing about that import is built yet, and
  # nothing here anticipates it beyond leaving the door open.

  # "MANUAL"   — entered by hand, and it already happened.
  # "FORECAST" — entered by hand, and it is expected.
  # "IMPORT"   — read out of a bank statement CSV, and it already happened.
  # Validated in lib/transactionKind.ts, like every other string enum here.
  #
  # IMPORT IS PROVENANCE, NOT A THIRD KIND OF MONEY. An imported row is an
  # actual: `status: "POSTED"`, counted in every real-money total exactly like
  # a MANUAL one, and the split this table exists to make — happened vs.
  # expected — still runs entirely through `status`. What the value buys is the
  # ability to say where a row came from: which rows a person typed, which the
  # bank did, and (once Plaid lands) which a feed did, without any of them
  # needing a table of their own.
  source: String! @default(value: "MANUAL")
  # "POSTED" — real money moved.
  # "FORECASTED" — expected, hasn't happened yet.
  #
  # Deliberately NOT derivable from `source`, even though today the two move
  # together: marking a projection as received flips `status` to POSTED while
  # `source` stays FORECAST, which is what preserves "this started life as a
  # projection" after the fact. Collapsing them into one column would throw
  # that away the moment it becomes interesting.
  status: String! @default(value: "POSTED")

  # Identity of the statement line this row was imported from, or null for a
  # row that was not imported — which is the normal case and not a gap to
  # backfill.
  #
  # WHAT IT IS FOR: importing the same statement twice must not double the
  # household's money, and people do that constantly — they re-download a month
  # to pick up the last few days of it, or a wider range to fill a gap. A bank
  # CSV carries no transaction id, so the identity has to be reconstructed from
  # the columns (day, signed amount, memo, plus an ordinal for the genuinely
  # identical rows) and scoped by owner and account. lib/wellsFargoCsv.ts builds
  # it; see importKeyFor() there for the full shape and its one trade-off.
  #
  # @unique IS THE POINT, and the pre-flight check in hooks/useTransactionImport.ts
  # is not. That hook reads the keys it is about to write and filters out the
  # ones already present, which is what makes the import report "142 new, 88
  # already imported" instead of failing — but it is a read followed by a write,
  # so two imports racing each other both see a clean slate. The constraint is
  # what actually holds the invariant, and it holds it in the safe direction:
  # the loser's batch is rejected rather than quietly duplicating a month of
  # somebody's spending.
  #
  # Nullable, so Postgres permits many NULLs under the unique index and every
  # hand-entered row is unaffected — the same arrangement as
  # FamilyMember.selfUser above. Nullable also makes this ON DELETE SET NULL
  # rather than CASCADE, which is moot for a scalar but worth not getting
  # backwards.
  #
  # Scoped by owner INSIDE the value rather than by a composite unique on
  # (user, importKey): Data Connect derives uniqueness from the directive, and a
  # single opaque string that already contains the owner needs no second column
  # kept in step with it.
  importKey: String @unique

  # ── Internal transfers: money that does not enter or leave the household ──
  #
  # TWO FLAGS, NOT ONE, because they answer different questions and only one of
  # them is about a single person:
  #
  #   isInternalToUser   — between one account holder's OWN accounts. Their
  #                        checking to their savings. Not income or spending for
  #                        anybody, at any level.
  #   isInternalToFamily — between two people IN the household. One member paying
  #                        another. Real money moving for each of them
  #                        individually, and nothing at all at household level,
  #                        where the two legs cancel.
  #
  # Both are excluded from household-wide totals together, and for the same
  # reason: a transfer's two legs are a real credit and a real debit, so counting
  # them adds the same amount to BOTH sides of the month. Where both accounts were
  # imported the legs cancel and the net is untouched, which is what makes the
  # distortion hard to notice at all; where only one was, counting it makes the
  # net wrong too, because money moved into an un-imported account is reported as
  # having left the household.
  #
  # Keeping them apart rather than collapsing to one boolean is what makes "who
  # paid whom inside this household" answerable later without re-deriving it, and
  # it is the only distinction that could ever justify a per-member view counting
  # one and not the other.
  #
  # STORED, NOT DERIVED, and that is forced rather than chosen. Both are decided
  # from the statement memo — Wells Fargo's "ONLINE TRANSFER" prefix for the
  # first, a household member's name in a Zelle or person-to-person memo for the
  # second — and the raw memo is deliberately not kept, only the counterparty
  # extracted from it. Nothing could ask the question again afterwards.
  #
  # ...which is why lib/internalTransfers.ts classifies from the STORED merchant
  # and method as well as from a raw memo. The prefix survives extraction
  # ("ONLINE TRANSFER TO ..." is what `merchant` holds), so rows imported before
  # these columns existed are still classifiable — see the re-check action in
  # hooks/useInternalTransferSync.ts. Without that, 592 already-imported rows in
  # a real household would have sat unflagged forever and the toggle would have
  # looked broken.
  #
  # Both default false, so a hand-entered row and any row predating these columns
  # read as ordinary money. lib/ledgerTotals.ts treats null as false — the
  # direction that hides nothing.
  isInternalToUser: Boolean @default(expr: "false")
  isInternalToFamily: Boolean @default(expr: "false")

  # The bank's own reference for this transaction, as printed in the statement
  # memo ("S000000000000014", "REF #IB00000001"). Null for a hand-entered row,
  # and null for an imported one whose memo carried none.
  #
  # WHY THIS IS WORTH A COLUMN. It is the only thing in a Wells Fargo export that
  # identifies a transaction rather than describing it, and it is what makes
  # re-uploading an overlapping statement correct instead of merely usually
  # correct. A PENDING row and the SETTLED version of the same purchase are two
  # completely different lines — different memo format, usually a different date,
  # sometimes a different amount once a tip lands — so `importKey` sees two
  # unrelated rows and imports the charge twice. A settled row carries a
  # reference; matching on it resolves that pair exactly, with no guessing.
  #
  # It cuts the other way too, and that half matters just as much: two rows whose
  # references are both present and DIFFERENT are definitely two transactions,
  # however alike they look. That is what stops two same-price shops at the same
  # supermarket in one week being reported as a duplicate.
  #
  # DELIBERATELY NOT @unique, unlike importKey. A pending row has no reference at
  # all, so the constraint would not cover the rows that need it most; an amount
  # that legitimately changes between pending and settled must not be refused
  # outright, because that case needs a person to look at it; and the same
  # reference can appear in two different accounts' exports. This is evidence for
  # lib/importReconcile.ts to weigh, and `importKey` remains the hard constraint.
  importRef: String

  # Which upload wrote this row, or null for a row nobody uploaded.
  #
  # This is the handle "undo that import" is built on, and it is why it is a
  # foreign key rather than a second string: an upload is an entity with its own
  # facts (what it was called, how much of it was skipped, when it happened),
  # and those belong on one row rather than repeated onto every transaction that
  # came from it. See StatementImport above, including why removing one is two
  # mutations and not a cascade.
  #
  # Nullable and null by default, like importKey. The two travel together —
  # every imported row has both, every other row has neither — but they answer
  # different questions: this one says which upload, importKey says which line.
  statementImport: StatementImport

  createdAt: Timestamp!
}

# A named color scheme (e.g. "Ocean", "Forest") a user can pick in Settings.
# Each scheme has exactly one light and one dark Theme row (see below); the
# existing next-themes light/dark switch selects which variant applies, so
# switching dark mode re-themes using the same scheme instead of leaving it.
type ColorScheme @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  createdAt: Timestamp! @default(expr: "request.time")
}

# One light or dark variant of a ColorScheme. Fields mirror HeroUI's base
# semantic color tokens (@heroui/styles themes/default/variables.css) —
# hover/soft/secondary variants are all derived from these via color-mix(),
# so setting just these overrides the whole HeroUI palette consistently.
# Status colors (success/warning/danger) are deliberately left out: they
# stay constant across schemes so meaning (income vs. overspend) doesn't
# shift when someone changes their theme.
type Theme @table @unique(fields: ["colorScheme", "isDark"]) {
  id: UUID! @default(expr: "uuidV4()")
  colorScheme: ColorScheme!
  isDark: Boolean!
  background: String!
  foreground: String!
  surface: String!
  surfaceForeground: String!
  overlay: String!
  overlayForeground: String!
  muted: String!
  default: String!
  defaultForeground: String!
  accent: String!
  accentForeground: String!
  border: String!
  separator: String!
  createdAt: Timestamp! @default(expr: "request.time")
}
